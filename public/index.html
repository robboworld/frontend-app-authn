<!doctype html>
<html lang="en-us">
  <head>
      <title><%= (process.env.SITE_NAME && process.env.SITE_NAME != 'null') ? 'Authentication | ' + process.env.SITE_NAME : 'Authentication' %></title>    
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="shortcut icon" href="<%=htmlWebpackPlugin.options.FAVICON_URL%>" type="image/x-icon"/>
      <!-- Robbo: no upstream iframeResizer.contentWindow from cdnjs. It only serves authn embedded in a
           parent page's iframe, which Robbo never does, and the synchronous script kept the login page
           blank while cdnjs.cloudflare.com answered (slow from Russia). -->
      <% if (process.env.OPTIMIZELY_URL) { %>
        <script
          src="<%= process.env.OPTIMIZELY_URL %>"
        ></script>
      <% } else if (process.env.OPTIMIZELY_PROJECT_ID) { %>
        <script
          src="<%= process.env.MARKETING_SITE_BASE_URL %>/optimizelyjs/<%= process.env.OPTIMIZELY_PROJECT_ID %>.js"
        ></script>
      <% } %>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
